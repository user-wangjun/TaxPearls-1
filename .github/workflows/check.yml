name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TAXPEARLS_PDF_BROWSER: chromium
      TAXPEARLS_AI_ENABLED: "0"
      TAXPEARLS_NOTIFICATION_EMAIL_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m ruff check main.py src webapp scripts tests
      - run: python -B -X utf8 scripts/check_project.py
      - run: git diff --exit-code
